services:
  postgres:
    image: postgres:16-alpine
    container_name: auth_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/app_db
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_worker
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/app_db
      - DEMO_MODE=true
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    command: python -m app.tasks.pipeline

  mock_camera:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auth_mock_camera
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - .:/app
    command: uvicorn MockServer.server:app --host 0.0.0.0 --port 8081 --reload

volumes:
  postgres_data: